server:
  port: 9093

spring:
  application:
    name: order-service

  jpa:
    hibernate:
     ddl-auto: update
    show-sql: true
    properties:
     hibernate:
       dialect: org.hibernate.dialect.MySQLDialect
  # Using local db for development purposes     
  datasource:
   url: jdbc:mysql://localhost:3306/ORDER_DB
   username: myuser
   password: secret
   driver-class-name: com.mysql.cj.jdbc.Driver  

  security:
    user:
      name: boot
      password: spring